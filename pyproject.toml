[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0", "cmake>=3.20", "ninja>=1.11"]
build-backend = "scikit_build_core.build"

[project]
name = "contextmemory"
version = "0.1.0"
description = "A graph + temporal memory layer for agentic systems. C++ core, deterministic read path, single-command install."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
contextmemory = "contextmemory.cli:main"

[tool.scikit-build]
cmake.source-dir = "core"
wheel.packages = ["contextmemory"]
build-dir = "build/{wheel_tag}"

[tool.setuptools.packages.find]
where = ["."]
include = ["contextmemory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]